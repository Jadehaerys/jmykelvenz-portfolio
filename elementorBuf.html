    function setText(id, value) {
      var el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function getRefCode() {
      try {
        return new URLSearchParams(window.location.search).get("ref") || "";
      } catch (error) {
        return "";
      }
    }

    function addCurrentRef(rawUrl) {
      var ref = getRefCode();
      if (!ref || !rawUrl) return rawUrl;

      try {
        var url = new URL(rawUrl, window.location.href);
        url.searchParams.set("ref", ref);
        return url.toString();
      } catch (error) {
        return rawUrl;
      }
    }

    function setHref(id, value) {
      var el = document.getElementById(id);
      if (el) el.setAttribute("href", addCurrentRef(value));
    }

    function updatePricingLinks(useYearly) {
      document.querySelectorAll("#pricing [data-monthly-link][data-yearly-link]").forEach(function (link) {
        var rawUrl = useYearly ? link.dataset.yearlyLink : link.dataset.monthlyLink;
        link.setAttribute("href", addCurrentRef(rawUrl));
      });
    }

    window.setBilling = function (useYearly) {
      yearly = Boolean(useYearly);
      var grid = document.getElementById("pricing-grid");
      var toggle = document.getElementById("billing-toggle");
      var monthlyLabel = document.getElementById("toggle-monthly-label");
      var yearlyLabel = document.getElementById("toggle-yearly-label");

      if (grid) grid.classList.toggle("yearly", yearly);
      if (grid) grid.dataset.billing = yearly ? "yearly" : "monthly";
      if (toggle) {
        toggle.classList.toggle("active", yearly);
        toggle.setAttribute("aria-checked", yearly ? "true" : "false");

      if (monthlyLabel) monthlyLabel.classList.toggle("active", !yearly);
      if (yearlyLabel) yearlyLabel.classList.toggle("active", yearly);

      updatePricingLinks(yearly);
    };

      window.setBilling(!yearly);
    };

          }
        });
      }

          var useYearly = Boolean(grid && grid.classList.contains("yearly"));
          var rawUrl = useYearly ? link.dataset.yearlyLink : link.dataset.monthlyLink;
          link.setAttribute("href", addCurrentRef(rawUrl));
        });
      });
      window.setBilling(false);
    });
  })();

        });

      render();

      document.querySelectorAll(".ind-pill").forEach(function (pill) {
        pill.addEventListener("click", function () {
          showIndustry(pill.dataset.target);
        });
      });

      wireVideoOverlays();
      applyGlobalQuoteLinks('');

      window.Scale360Walkthroughs = {
        industries: industries.map(function (industry) { return industry.id; }),
        showIndustry: showIndustry
      };
    })();
  </script>

<script id="scale360-ref-carryover-guard">
  (function () {
    function getRefCode() {
      try {
        return new URLSearchParams(window.location.search).get("ref") || "";
      } catch (error) {
        return "";
      }
    }

    function canCarryRef(href) {
      if (!href) return false;
      return !/^#/.test(href) && !/^(mailto:|tel:|sms:|javascript:)/i.test(href);
    }

    function addCurrentRef(rawUrl) {
      var ref = getRefCode();
      if (!ref || !canCarryRef(rawUrl)) return rawUrl;

      try {
        var url = new URL(rawUrl, window.location.href);
        var existingParams = Array.from(url.searchParams.entries());
        var orderedParams = new URLSearchParams();

        orderedParams.set("ref", ref);
        existingParams.forEach(function (entry) {
          if (entry[0] === "ref") return;
          orderedParams.append(entry[0], entry[1]);
        });

        url.search = orderedParams.toString();
        return url.toString();
      } catch (error) {
        return rawUrl;
      }
    }

    window.Scale360CarryRefToCtas = function () {
      if (!getRefCode()) return;

      document.querySelectorAll("a[href]").forEach(function (link) {
        var href = link.getAttribute("href");
        if (!canCarryRef(href)) return;
        link.setAttribute("href", addCurrentRef(href));
      });
    };

    document.addEventListener("DOMContentLoaded", window.Scale360CarryRefToCtas);
    window.addEventListener("pageshow", window.Scale360CarryRefToCtas);

    document.addEventListener("click", function (event) {
      var link = event.target.closest && event.target.closest("a[href]");
      if (!link) return;

      var href = link.getAttribute("href");
      if (!canCarryRef(href)) return;

      link.setAttribute("href", addCurrentRef(href));
    }, true);
  })();
</script>
